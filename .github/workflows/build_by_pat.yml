name: Build Nexa By PAT

# ============================================================
# Workflow Trigger
# ============================================================

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example: v1.0.0"
        required: true
        default: "v1.0.0"


# ============================================================
# Default permissions
# ============================================================

permissions:
  contents: read


jobs:

  # ==========================================================
  # Build Matrix
  # ==========================================================

  build:

    name: ${{ matrix.target }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # --------------------------------------------------
          # Dart CLI
          # --------------------------------------------------

          - target: actions-linux
            os: ubuntu-latest

          - target: actions-windows
            os: windows-latest


          # --------------------------------------------------
          # Flutter Desktop
          # --------------------------------------------------

          - target: commander-linux
            os: ubuntu-latest

          - target: commander-windows
            os: windows-latest


          # --------------------------------------------------
          # Flutter Android
          # --------------------------------------------------

          - target: commander-android
            os: ubuntu-latest


    runs-on: ${{ matrix.os }}


    steps:

      # ======================================================
      # 1. Checkout private nexa
      # ======================================================

      - name: Checkout private nexa
        uses: actions/checkout@v4
        with:
          repository: u4-d/nexa
          token: ${{ secrets.NEXA_PAT }}
          path: nexa
          fetch-depth: 1


      # ======================================================
      # 2. Setup Flutter
      #
      # Flutter SDK also provides Dart.
      #
      # Therefore this is required for:
      #
      #   actions-linux
      #   actions-windows
      #   commander-linux
      #   commander-windows
      #   commander-android
      #
      # ======================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ======================================================
      # 3. Show Flutter / Dart versions
      # ======================================================

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version


      # ======================================================
      # 4. Setup Python
      #    Only needed for Windows actions
      # ======================================================

      - name: Setup Python
        if: matrix.target == 'actions-windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ======================================================
      # 5. Cache pip
      # ======================================================

      - name: Cache pip
        if: matrix.target == 'actions-windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-pyinstaller-v1


      # ======================================================
      # 6. Install Python build dependencies
      # ======================================================

      - name: Install Python dependencies
        if: matrix.target == 'actions-windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas xlrd pyinstaller


      # ======================================================
      # 7. Verify Flutter desktop platforms
      #
      # Only useful for commander desktop builds.
      # This makes the error easier to diagnose.
      # ======================================================

      - name: Check Linux project
        if: matrix.target == 'commander-linux'
        working-directory: nexa/nexa_commander
        run: |
          echo "===== Project files ====="
          ls -la
          echo "===== Linux directory ====="
          if [ -d linux ]; then
            ls -la linux
          else
            echo "ERROR: linux/ directory does not exist."
            exit 1
          fi


      - name: Check Windows project
        if: matrix.target == 'commander-windows'
        working-directory: nexa/nexa_commander
        shell: pwsh
        run: |
          Write-Host "===== Project files ====="
          Get-ChildItem

          Write-Host "===== Windows directory ====="

          if (Test-Path windows) {
            Get-ChildItem windows
          }
          else {
            Write-Error "ERROR: windows/ directory does not exist."
            exit 1
          }


      # ======================================================
      # 8. Install Dart / Flutter workspace dependencies
      #
      # nexa is a Dart Workspace.
      #
      # No pubspec_overrides.yaml is created.
      #
      # ======================================================

      - name: Install workspace dependencies
        working-directory: nexa
        run: |
          flutter pub get


      # ======================================================
      # 9. Build actions - Linux
      # ======================================================

      - name: Build actions Linux
        if: matrix.target == 'actions-linux'
        working-directory: nexa
        run: |
          dart compile exe \
            actions/bin/actions.dart \
            -o ../actions-linux


      # ======================================================
      # 10. Build actions - Windows
      # ======================================================

      - name: Build actions Windows
        if: matrix.target == 'actions-windows'
        working-directory: nexa
        shell: pwsh
        run: |
          dart compile exe `
            actions/bin/actions.dart `
            -o ..\actions-windows.exe


      # ======================================================
      # 11. Build convert_xls_to_csv.exe
      # ======================================================

      - name: Build convert_xls_to_csv.exe
        if: matrix.target == 'actions-windows'
        working-directory: nexa
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name convert_xls_to_csv `
            convert_xls_to_csv.py

          Copy-Item `
            dist\convert_xls_to_csv.exe `
            ..\convert_xls_to_csv.exe


      # ======================================================
      # 12. Build nexa_commander - Linux
      # ======================================================

      - name: Build nexa_commander Linux
        if: matrix.target == 'commander-linux'
        working-directory: nexa/nexa_commander
        run: |
          flutter build linux --release


      # ======================================================
      # 13. Build nexa_commander - Windows
      # ======================================================

      - name: Build nexa_commander Windows
        if: matrix.target == 'commander-windows'
        working-directory: nexa/nexa_commander
        run: |
          flutter build windows --release


      # ======================================================
      # 14. Build nexa_commander - Android
      # ======================================================

      - name: Build nexa_commander Android
        if: matrix.target == 'commander-android'
        working-directory: nexa/nexa_commander
        run: |
          flutter build apk --release


      # ======================================================
      # 15. Prepare actions Linux artifact
      # ======================================================

      - name: Prepare actions Linux artifact
        if: matrix.target == 'actions-linux'
        run: |
          mkdir -p artifact/linux

          cp \
            actions-linux \
            artifact/linux/actions


      # ======================================================
      # 16. Prepare actions Windows artifact
      # ======================================================

      - name: Prepare actions Windows artifact
        if: matrix.target == 'actions-windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            artifact\windows

          Copy-Item `
            actions-windows.exe `
            artifact\windows\actions.exe

          Copy-Item `
            convert_xls_to_csv.exe `
            artifact\windows\convert_xls_to_csv.exe


      # ======================================================
      # 17. Prepare commander Linux artifact
      # ======================================================

      - name: Prepare commander Linux artifact
        if: matrix.target == 'commander-linux'
        run: |
          mkdir -p artifact/linux/nexa_commander

          cp -R \
            nexa/nexa_commander/build/linux/x64/release/bundle/* \
            artifact/linux/nexa_commander/


      # ======================================================
      # 18. Prepare commander Windows artifact
      # ======================================================

      - name: Prepare commander Windows artifact
        if: matrix.target == 'commander-windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            artifact\windows\nexa_commander

          Copy-Item `
            nexa\nexa_commander\build\windows\x64\runner\Release\* `
            artifact\windows\nexa_commander\ `
            -Recurse


      # ======================================================
      # 19. Prepare commander Android artifact
      # ======================================================

      - name: Prepare commander Android artifact
        if: matrix.target == 'commander-android'
        run: |
          mkdir -p artifact/android

          cp \
            nexa/nexa_commander/build/app/outputs/flutter-apk/app-release.apk \
            artifact/android/nexa-commander.apk


      # ======================================================
      # 20. Upload Matrix artifact
      # ======================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact
          retention-days: 1


  # ==========================================================
  # Package Release
  # ==========================================================

  package:

    name: Package Release

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write


    steps:

      # ======================================================
      # 21. Download all Matrix artifacts
      # ======================================================

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      # ======================================================
      # 22. Show artifact structure
      # ======================================================

      - name: Show artifact structure
        run: |
          echo "===== Artifacts ====="
          find artifacts -print | sort


      # ======================================================
      # 23. Create release directories
      # ======================================================

      - name: Prepare release directories
        run: |
          mkdir -p release/nexa-actions
          mkdir -p release/nexa-commander


      # ======================================================
      # 24. Assemble nexa-actions
      # ======================================================

      - name: Assemble nexa-actions
        run: |

          mkdir -p release/nexa-actions/linux
          mkdir -p release/nexa-actions/windows

          cp \
            artifacts/actions-linux/linux/actions \
            release/nexa-actions/linux/actions

          cp \
            artifacts/actions-windows/windows/actions.exe \
            release/nexa-actions/windows/actions.exe

          cp \
            artifacts/actions-windows/windows/convert_xls_to_csv.exe \
            release/nexa-actions/windows/convert_xls_to_csv.exe


      # ======================================================
      # 25. Assemble nexa-commander
      # ======================================================

      - name: Assemble nexa-commander
        run: |

          mkdir -p release/nexa-commander/linux
          mkdir -p release/nexa-commander/windows
          mkdir -p release/nexa-commander/android

          cp -R \
            artifacts/commander-linux/linux/nexa_commander \
            release/nexa-commander/linux/

          cp -R \
            artifacts/commander-windows/windows/nexa_commander \
            release/nexa-commander/windows/

          cp \
            artifacts/commander-android/android/nexa-commander.apk \
            release/nexa-commander/android/nexa-commander.apk


      # ======================================================
      # 26. Show final release structure
      # ======================================================

      - name: Show final release structure
        run: |
          echo "===== Final Release ====="
          find release -print | sort


      # ======================================================
      # 27. Create nexa-actions.zip
      # ======================================================

      - name: Create nexa-actions.zip
        run: |
          cd release

          zip -r \
            ../nexa-actions.zip \
            nexa-actions


      # ======================================================
      # 28. Create nexa-commander.zip
      # ======================================================

      - name: Create nexa-commander.zip
        run: |
          cd release

          zip -r \
            ../nexa-commander.zip \
            nexa-commander


      # ======================================================
      # 29. Create GitHub Release
      # ======================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Nexa ${{ inputs.version }}
          generate_release_notes: true
          files: |
            nexa-actions.zip
            nexa-commander.zip
